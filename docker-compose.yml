version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_lms_postgres
    environment:
      POSTGRES_USER: shaiksohel
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_learning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaiksohel -d ai_learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_lms_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://shaiksohel:password@postgres:5432/ai_learning_db
      PRIMARY_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-your_groq_api_key_here}
      GROQ_MODELS: llama-3.3-70b-versatile,deepseek-r1-distill-llama-70b,qwen/qwen3-32b,openai/gpt-oss-120b,llama-3.1-8b-instant
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      GEMINI_MODELS: models/gemini-3.6-flash,models/gemini-3.5-flash,models/gemini-flash-latest,models/gemini-3.5-flash-lite,models/gemini-3.1-flash-lite
      SECRET_KEY: ${SECRET_KEY:-your_jwt_secret_key_here}
    volumes:
      - ./backend/chroma_db:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_lms_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
